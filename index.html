<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日股價追蹤</title>
<style>
  :root{
    --bg:#eef2f7; --panel:#ffffff; --ink:#18212e; --muted:#6b7686; --line:#dde3ec;
    --up:#d23b3b; --down:#1e9e5a; --flat:#6b7686; --accent:#2f6fb5; --hover:#f3f6fa;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0e1622; --panel:#16202e; --ink:#e7ecf3; --muted:#8e9aab; --line:#253246;
      --up:#ff6b6b; --down:#3ecf85; --accent:#7fb0e0; --hover:#1c2838; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:15px}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 48px}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
  h1{font-size:22px;margin:0;letter-spacing:.02em}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  select,button{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
  button:hover,select:hover{border-color:var(--muted)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:6px 10px}
  .seg button.on{background:var(--ink);color:var(--bg)}
  #grp{flex-wrap:wrap}
  tr.mh td{background:var(--bg);font-size:12px;color:var(--muted);padding:6px 12px;cursor:default;text-align:left}
  tr.mh:hover{background:none}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;display:none;z-index:9}
  .banner{background:#fff4d6;color:#6b5200;border:1px solid #f0dc9c;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
  @media (prefers-color-scheme: dark){.banner{background:#3a3115;color:#f3dc90;border-color:#5a4a1c}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  th,td{padding:10px 12px;text-align:right;white-space:nowrap}
  th{font-size:12px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
  th:first-child,td:first-child{text-align:left}
  tbody tr{border-bottom:1px solid var(--line);cursor:pointer}
  tbody tr:last-child{border-bottom:0}
  tbody tr:hover{background:var(--hover)}
  tbody tr.sel{background:var(--hover);box-shadow:inset 3px 0 0 var(--accent)}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .code{font-family:var(--mono);color:var(--muted);font-size:12px;margin-right:6px}
  .tag{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
  .stale{color:var(--muted);font-size:11px;margin-left:4px}
  .detail{margin-top:16px;padding:16px}
  .dhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
  .dname{font-size:18px;font-weight:600}
  .dprice{font-family:var(--mono);font-size:22px}
  .chart{position:relative;width:100%;height:260px}
  .chart svg{width:100%;height:100%;display:block}
  .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-120%);display:none}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:12px}
  .stat{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .stat .k{font-size:11px;color:var(--muted)} .stat .v{font-family:var(--mono);font-size:15px;margin-top:2px}
  .hist{margin-top:12px;max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:8px}
  .hist th{position:sticky;top:0;background:var(--panel);cursor:default}
  .hist tr{cursor:default}
  .tabs{display:flex;gap:4px;margin:0 0 14px;border-bottom:1px solid var(--line)}
  .tabs button{border:0;border-radius:0;background:none;padding:8px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
  .pad{padding:14px 16px;margin-bottom:12px}
  .card h3{font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .card h3 small{font-weight:400;color:var(--muted);font-size:12px}
  .mbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .mbar select{flex:1;min-width:200px;font-size:15px;padding:8px 10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:760px){.grid2{grid-template-columns:1fr}}
  .grid2 > .card{margin-bottom:0}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;font-size:14px}
  .kv label{color:var(--muted);font-size:13px}
  input.in,select.in{font:inherit;font-family:var(--mono);font-size:14px;width:100%;max-width:130px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);text-align:right}
  input.in.sm,select.in.sm{max-width:78px;padding:4px 6px}
  input.in:focus,select.in:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .mt td,.mt th{padding:7px 8px;font-size:13px}
  .mt tbody tr{cursor:default}
  .mt td:nth-child(2),.mt th:nth-child(2){text-align:left}
  .mt.sens td:nth-child(2),.mt.sens th:nth-child(2){text-align:right}
  .grid2 .mt td:nth-child(2),.grid2 .mt th:nth-child(2){text-align:right}
  .mt tr.off td{color:var(--muted);opacity:.6}
  .hero{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline}
  .hero .big{font-family:var(--mono);font-size:26px}
  .chip{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;margin-left:4px;vertical-align:middle;white-space:nowrap}
  .s-off{background:#e3effd;color:#1d5fa8} .s-est{background:#fdf0dc;color:#8a5a00} .s-con{background:#ece6fb;color:#5b3fb0} .s-man{background:#e6f5ec;color:#1e7a46}
  @media (prefers-color-scheme: dark){ .s-off{background:#16304f;color:#9cc6f5} .s-est{background:#3d2e12;color:#f0c879} .s-con{background:#2c2350;color:#c4b5f5} .s-man{background:#16362a;color:#8fdcae} }
  .epsrow{display:grid;grid-template-columns:96px 120px 1fr;gap:4px 10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
  .epsrow:last-of-type{border-bottom:0}
  .epsrow .why{grid-column:2 / 4;font-size:11.5px;color:var(--muted);line-height:1.45}
  .linkbtn{border:0;background:none;color:var(--accent);padding:0 2px;font-size:12px;cursor:pointer;text-decoration:underline}
  .pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
  .scen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .scen .box{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .scen .lab{font-size:12px;color:var(--muted)} .scen .tp{font-family:var(--mono);font-size:22px;margin:2px 0}
  .scen .sub{font-size:12px;font-family:var(--mono);color:var(--muted)}
  .wt{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--hover);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
  .sens td.hi{font-weight:600}
  .warn{color:#b26a00;font-size:13px} @media (prefers-color-scheme: dark){.warn{color:#f3b45a}}
  .note{font-size:13px;color:var(--muted);line-height:1.6}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
  .modal .box{background:var(--panel);border-radius:12px;padding:16px;width:min(680px,100%);max-height:90vh;display:flex;flex-direction:column;gap:10px}
  .modal textarea{width:100%;height:50vh;font-family:var(--mono);font-size:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
  .ev td{vertical-align:top}
  .ev .dd{font-family:var(--mono);white-space:nowrap}
  .ev .det{font-size:12px;color:var(--muted);white-space:normal;max-width:520px;margin-top:2px}
  .ev td:nth-child(3){white-space:normal;text-align:left}
  .t-法說會{background:#e3effd;color:#1d5fa8} .t-股東會{background:#ece6fb;color:#5b3fb0} .t-股利{background:#fdf0dc;color:#8a5a00}
  .t-財報{background:#e6f5ec;color:#1e7a46} .t-董事會{background:#eef1f5;color:#4a5568} .t-庫藏股{background:#fde8e8;color:#b42318}
  @media (prefers-color-scheme: dark){ .t-法說會{background:#16304f;color:#9cc6f5} .t-股東會{background:#2c2350;color:#c4b5f5} .t-股利{background:#3d2e12;color:#f0c879} .t-財報{background:#16362a;color:#8fdcae} .t-董事會{background:#253246;color:#c3cddb} .t-庫藏股{background:#4a1d1d;color:#f5a3a3} }
  .soon{font-size:11px;color:var(--accent);display:block}
  footer{color:var(--muted);font-size:12px;margin-top:20px;line-height:1.6}
  @media (max-width:600px){
    .hide-sm,.card > table .tag{display:none}
    th,td{padding:9px 8px}
    .card > table td:first-child{white-space:normal}
    .card > table .stale{display:block;margin:2px 0 0}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>每日股價追蹤</h1>
      <div class="sub" id="updated">載入中…</div>
    </div>
    <div class="controls">
      <div class="seg" id="grp"></div>
      <select id="date" title="選擇日期，查看同一天的收盤價"></select>
      <button id="copy" title="複製目前分頁的統一日收盤價，可直接貼到 Excel">複製價格</button>
      <button id="csv">下載 CSV</button>
    </div>
  </header>
  <div id="banner"></div>
  <nav class="tabs"><button data-v="prices" class="on">股價</button><button data-v="model">估值模型</button><button data-v="report">月報</button><button data-v="beta">組合 Beta</button></nav>

  <section id="vPrices">
  <div class="card">
    <table>
      <thead><tr>
        <th data-k="name">股票</th>
        <th data-k="c">收盤</th>
        <th data-k="chg" class="hide-sm">漲跌</th>
        <th data-k="pct">漲跌幅</th>
        <th data-k="v" class="hide-sm">成交量</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="card detail" id="detail" style="display:none">
    <div class="dhead">
      <div><span class="dname" id="dname"></span> <span class="code" id="dcode"></span> <button id="toModel" style="padding:3px 10px;font-size:13px">看估值模型 →</button></div>
      <div class="seg" id="range">
        <button data-r="22">1月</button><button data-r="66" class="on">3月</button><button data-r="132">6月</button><button data-r="252">1年</button><button data-r="0">全部</button>
      </div>
    </div>
    <div class="dprice" id="dprice"></div>
    <div class="chart" id="chart"><svg id="svg"></svg><div class="tip" id="tip"></div></div>
    <div class="stats" id="stats"></div>
    <div class="hist"><table>
      <thead><tr><th>日期</th><th>開</th><th>高</th><th>低</th><th>收</th><th>漲跌</th><th class="hide-sm">成交量</th></tr></thead>
      <tbody id="hrows"></tbody>
    </table></div>
  </div>

  </section>

  <section id="vModel" style="display:none">
    <div class="mbar">
      <select id="mStock"></select>
      <button id="mExport">匯出設定</button>
      <button id="mReset">清除本機修改</button>
    </div>
    <div id="mLocal" class="note" style="margin:-4px 0 10px"></div>
    <div id="mBody"></div>
  </section>

  <section id="vReport" style="display:none"><div id="rBody"></div></section>
  <section id="vBeta" style="display:none"><div id="bBody"></div></section>

  <div class="modal" id="modal"><div class="box">
    <b>匯出估值設定</b>
    <div class="note">把下面內容整個貼到 repo 的 <code>fundamentals.json</code>（取代原內容）並 commit，所有裝置就會用這份設定。</div>
    <textarea id="mJson" readonly></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button id="mCopyJson">複製</button><button id="mClose">關閉</button></div>
  </div></div>

  <footer>
    台股：證交所 / 櫃買中心 OpenAPI 盤後資料；美股與歷史回補：Yahoo Finance。台股紅漲綠跌。<br>
    估值模型為研究工具：EPS 與評分是假設輸入，結果不構成投資建議。<br>
    要改追蹤的股票，編輯 repo 裡的 <code>watchlist.json</code>；資料每個交易日由 GitHub Actions 自動更新。
  </footer>
</div>

<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);
let DB = null, group = "ALL", sortKey = null, sortDir = -1, selected = null, range = 66;

/* ---------- 載入資料 ---------- */
async function load(){
  try{
    const r = await fetch("data/prices.json?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    DB = await r.json();
    if(!DB.stocks || !Object.keys(DB.stocks).length) throw new Error("empty");
  }catch(e){
    DB = {stocks:{}, groups:[]};
    $("#banner").innerHTML = '<div class="banner">還沒有股價資料。請到 GitHub 的 Actions 手動執行一次「每日抓股價」。</div>';
  }
  if(DB.demo) $("#banner").innerHTML = '<div class="banner">目前顯示的是<b>示範股價</b>（隨機產生，非真實價格；有 11/06 收盤價的股票以該價為中心）。部署到 GitHub 並執行一次 Actions 後就會換成真實資料。</div>';
  await loadFund();
  $("#updated").textContent = "最後更新：" + (DB.updated || "—") + "（台北時間）";
  buildGroups(); buildDates();
  const first = stocks()[0]; if(first) selected = first.code;
  render();
  buildModelSelect();
  const h = decodeURIComponent(location.hash.slice(1));
  if(h.startsWith("m-") && DB.stocks[h.slice(2)]) openModel(h.slice(2));
}

function stocks(){
  return Object.entries(DB.stocks)
    .filter(([c,s]) => !s.hidden && s.history && s.history.length && s.market !== "IDX")
    .filter(([c,s]) => group === "ALL" || (s.groups||[]).includes(group))
    .map(([c,s]) => ({code:c, ...s}))
    .sort((a,b) => (a.market===b.market?0:a.market==="TW"?-1:1) || (a.order??999)-(b.order??999));
}

function buildGroups(){
  const gs = [{id:"ALL",name:"全部"}, ...(DB.groups||[])];
  $("#grp").innerHTML = gs.map(g=>`<button data-g="${g.id}" class="${g.id===group?"on":""}">${g.name}</button>`).join("");
  document.querySelectorAll("#grp button").forEach(b => b.onclick = () => {
    group = b.dataset.g; buildGroups(); buildDates(); buildModelSelect(); if(view==="report") renderReport();
    const f = stocks()[0]; selected = f ? f.code : null; if(!f) $("#detail").style.display="none";
    render();
  });
}

/* 每個市場的統一日 = 該市場（目前分頁）最新的交易日 */
function unified(){
  const u = {};
  stocks().forEach(s => { const d = s.history[s.history.length-1].d; if(!u[s.market] || d > u[s.market]) u[s.market] = d; });
  return u;
}

function buildDates(){
  const set = new Set();
  stocks().forEach(s => s.history.forEach(h => set.add(h.d)));
  const ds = [...set].sort().reverse();
  const sel = $("#date"), cur = sel.value;
  sel.innerHTML = '<option value="">統一日（各市場最新）</option>' + ds.map(d => `<option value="${d}">${d}</option>`).join("");
  if(ds.includes(cur)) sel.value = cur;
}

/* 取某檔在指定日期（或之前最近一日）的資料 */
function barAt(s, d){
  const h = s.history;
  for(let i=h.length-1;i>=0;i--) if(h[i].d <= d) return {bar:h[i], prev:h[i-1], exact:h[i].d===d};
  return {bar:null};
}

/* ---------- 格式 ---------- */
const fmt = (x, dp) => x==null ? "—" : Number(x).toLocaleString("en-US",{minimumFractionDigits:dp,maximumFractionDigits:dp});
const dpOf = s => s.market === "US" ? 2 : 2;
const cls = x => x==null||x===0 ? "flat" : x>0 ? "up" : "down";
const sign = x => x>0 ? "+" : "";
function vol(v, mkt){
  if(v==null) return "—";
  if(mkt==="TW") return fmt(v/1000,0) + " 張";
  if(v>=1e6) return fmt(v/1e6,1) + "M";
  return fmt(v,0);
}

/* ---------- 總表 ---------- */
function rowsFor(){
  const sel = $("#date").value, u = unified();
  return stocks().map(s => {
    const d = sel || u[s.market];
    const {bar, prev, exact} = barAt(s, d);
    const chg = bar ? (bar.chg ?? (prev ? bar.c - prev.c : null)) : null;
    const base = bar && chg!=null ? bar.c - chg : null;
    return {...s, d, bar, exact, chg, pct: base ? chg/base*100 : null, c: bar?.c, v: bar?.v};
  });
}

function render(){
  let list = rowsFor();
  if(sortKey){
    list.sort((a,b) => {
      const x=a[sortKey], y=b[sortKey];
      if(a.market!==b.market) return a.market==="TW"?-1:1;
      if(typeof x==="string") return sortDir * x.localeCompare(y,"zh-Hant");
      return sortDir * ((x??-Infinity) - (y??-Infinity));
    });
  }
  let lastM = null;
  $("#rows").innerHTML = list.map(s => {
    let head = "";
    if(s.market !== lastM){ lastM = s.market;
      head = `<tr class="mh"><td colspan="5">${s.market==="TW"?"台股（新台幣）":"美股（美元）"} · ${$("#date").value?"指定日":"統一日"} ${s.d||"—"}</td></tr>`; }
    return head + rowHtml(s);
  }).join("") || `<tr><td colspan="5" class="flat" style="text-align:center">沒有資料</td></tr>`;
  document.querySelectorAll("#rows tr[data-c]").forEach(tr => tr.onclick = () => select(tr.dataset.c));
  if(selected && DB.stocks[selected]) renderDetail();
}

function rowHtml(s){
    if(!s.bar) return `<tr data-c="${s.code}"><td><span class="code">${s.code}</span>${s.name||""}</td><td colspan="4" class="flat">此日期無資料</td></tr>`;
    const dp = dpOf(s);
    return `<tr data-c="${s.code}" class="${s.code===selected?"sel":""}">
      <td><span class="code">${s.code}</span>${s.name||""}<span class="tag">${s.exchange||s.market}</span>${!s.exact?`<span class="stale">⚠ ${s.bar.d} 收盤（非統一日）</span>`:""}</td>
      <td class="num">${fmt(s.c,dp)}</td>
      <td class="num hide-sm ${cls(s.chg)}">${s.chg==null?"—":sign(s.chg)+fmt(s.chg,dp)}</td>
      <td class="num ${cls(s.chg)}">${s.pct==null?"—":sign(s.pct)+fmt(s.pct,2)+"%"}</td>
      <td class="num hide-sm">${vol(s.v,s.market)}</td></tr>`;
}

/* ---------- 個股明細 ---------- */
function select(code){ selected = code; render(); renderDetail(); $("#detail").scrollIntoView({behavior:"smooth",block:"nearest"}); }

function renderDetail(){
  const s = {code:selected, ...DB.stocks[selected]};
  const h = s.history, dp = dpOf(s);
  const view = range ? h.slice(-range) : h;
  const last = h[h.length-1];
  $("#detail").style.display = "";
  $("#dname").textContent = s.name || s.code;
  $("#dcode").textContent = s.code + " · " + (s.exchange||s.market);
  const pc = last.chg!=null && last.c-last.chg ? last.chg/(last.c-last.chg)*100 : null;
  $("#dprice").innerHTML = `${fmt(last.c,dp)} <span class="${cls(last.chg)}" style="font-size:15px">${last.chg==null?"":sign(last.chg)+fmt(last.chg,dp)} ${pc==null?"":"("+sign(pc)+fmt(pc,2)+"%)"}</span> <span class="stale" style="font-size:12px">${last.d}</span>`;
  drawChart(view, dp);

  const cs = view.map(b=>b.c), hi = Math.max(...view.map(b=>b.h??b.c)), lo = Math.min(...view.map(b=>b.l??b.c));

  const ma = n => h.length>=n ? h.slice(-n).reduce((a,b)=>a+b.c,0)/n : null;

  ].map(([k,v])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");

  $("#hrows").innerHTML = view.slice().reverse().map(b=>`<tr>

    <td class="num">${fmt(b.c,dp)}</td><td class="num ${cls(b.chg)}">${b.chg==null?"—":sign(b.chg)+fmt(b.chg,dp)}</td>
    <td class="num hide-sm">${vol(b.v,s.market)}</td></tr>`).join("");
}

function drawChart(view, dp){
  const svg = $("#svg"), box = $("#chart").getBoundingClientRect();
  const W = box.width, H = box.height, P = {l:8, r:66, t:12, b:24};
  const cs = view.map(b=>b.c), min = Math.min(...cs), max = Math.max(...cs), pad = (max-min)*0.08 || max*0.01;
  const y0 = min-pad, y1 = max+pad;
  const X = i => P.l + (view.length<2 ? 0 : i*(W-P.l-P.r)/(view.length-1));
  const Y = v => P.t + (1-(v-y0)/(y1-y0))*(H-P.t-P.b);
  const up = cs[cs.length-1] >= cs[0];
  const col = getComputedStyle(document.documentElement).getPropertyValue(up?"--up":"--down").trim();
  const line = view.map((b,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(b.c).toFixed(1)}`).join("");
  const area = line + `L${X(view.length-1)},${H-P.b}L${X(0)},${H-P.b}Z`;
  let grid = "";
  for(let k=0;k<=3;k++){
    const v = y0 + (y1-y0)*k/3, y = Y(v);
    grid += `<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--line)"/>
             <text x="${W-P.r+6}" y="${y+4}" font-size="11" fill="var(--muted)" font-family="var(--mono)">${fmt(v,dp)}</text>`;
  }
  const ticks = [0, Math.floor((view.length-1)/2), view.length-1].filter((v,i,a)=>a.indexOf(v)===i)
    .map(i=>`<text x="${X(i)}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="${i===0?"start":i===view.length-1?"end":"middle"}">${view[i].d}</text>`).join("");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".18"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#g)"/><path d="${line}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/>
    ${ticks}<line id="cross" y1="${P.t}" y2="${H-P.b}" stroke="var(--muted)" stroke-dasharray="3 3" style="display:none"/><circle id="dot" r="4" fill="${col}" style="display:none"/>`;
  const tip = $("#tip"), cross = svg.querySelector("#cross"), dot = svg.querySelector("#dot");
  svg.onpointermove = e => {
    const r = svg.getBoundingClientRect(), x = e.clientX - r.left;
    const i = Math.max(0, Math.min(view.length-1, Math.round((x-P.l)/((W-P.l-P.r)/Math.max(1,view.length-1)))));
    const b = view[i];
    cross.setAttribute("x1",X(i)); cross.setAttribute("x2",X(i)); cross.style.display="";
    dot.setAttribute("cx",X(i)); dot.setAttribute("cy",Y(b.c)); dot.style.display="";
    tip.style.display="block"; tip.style.left = X(i)+"px"; tip.style.top = Y(b.c)+"px";
    tip.textContent = `${b.d}  ${fmt(b.c,dp)}`;
  };
  svg.onpointerleave = () => { tip.style.display="none"; cross.style.display="none"; dot.style.display="none"; };
}

/* =================== 估值模型 =================== */
const BASIS = {ttm:"近四季", fy26:"今年預估", fy27:"明年預估"};
const DEF_SET = {adjPerPoint:0.10, peCap:40, probs:[0.2,0.5,0.3],
  factors:[["規模與市場地位",.2],["客戶集中與地區風險",.15],["獲利能力與毛利趨勢",.2],["成長動能",.2],["財務風險（槓桿與流動性）",.15],["獲利品質與景氣循環",.1]]};
let EST = {stocks:{}}, EVENTS = {events:[]}, REV = {};
let FUND = {settings:{}, stocks:{}}, LOCAL = {settings:{}, stocks:{}}, mCode = null, view = "prices";

async function loadFund(){
  try{ const r = await fetch("fundamentals.json?t="+Date.now(), {cache:"no-store"}); if(r.ok) FUND = await r.json(); }catch(e){}
  FUND.settings = Object.assign({}, DEF_SET, FUND.settings||{}); FUND.stocks = FUND.stocks || {};
  try{ const r = await fetch("data/estimates.json?t="+Date.now(), {cache:"no-store"}); if(r.ok) EST = await r.json(); }catch(e){}
  try{ const r = await fetch("data/events.json?t="+Date.now(), {cache:"no-store"}); if(r.ok) EVENTS = await r.json(); }catch(e){}
  try{ const r = await fetch("data/revenue.json?t="+Date.now(), {cache:"no-store"}); if(r.ok) REV = await r.json(); }catch(e){}
  EST.stocks = EST.stocks || {};
  try{ const l = JSON.parse(localStorage.getItem("valuationLocal")||"null"); if(l) LOCAL = l; }catch(e){}
  LOCAL.settings = LOCAL.settings||{}; LOCAL.stocks = LOCAL.stocks||{};
}
const SET = () => ({...FUND.settings, ...LOCAL.settings});
const FS = c => ({...(FUND.stocks[c]||{}), ...(LOCAL.stocks[c]||{})});
function setF(c,k,v){ (LOCAL.stocks[c] = LOCAL.stocks[c]||{})[k] = v; saveLocal(); }
function setS(k,v){ LOCAL.settings[k] = v; saveLocal(); }
function saveLocal(){ try{ localStorage.setItem("valuationLocal", JSON.stringify(LOCAL)); }catch(e){} }
const numOrNull = v => (v===""||v==null||isNaN(+v)) ? null : +v;

function globalUnified(){
  const u = {};
  Object.values(DB.stocks).forEach(s => { if(s.hidden||!s.history?.length) return; const d=s.history[s.history.length-1].d; if(!u[s.market]||d>u[s.market]) u[s.market]=d; });
  return u;
}
function priceOf(code){
  const s = DB.stocks[code]; if(!s||!s.history?.length) return null;
  const d = $("#date").value || globalUnified()[s.market];
  const {bar, exact} = barAt(s, d); return bar ? {p:bar.c, d:bar.d, exact} : null;
}
/* EPS：手動（網頁或 fundamentals.json）優先，否則用每日自動抓取的值 */
function epsInfo(c,b){
  const m = numOrNull(FS(c)["eps_"+b]), a = (EST.stocks[c]||{})[b] || null;
  if(m != null) return {v:m, src:"手動", auto:a, manual:true};
  if(a && a.v != null) return {v:+a.v, src:a.src, auto:a, manual:false};
  return {v:null, src:null, auto:null, manual:false};
}
const epsOf = (c,b) => epsInfo(c,b).v;
const SRC_CLS = {"官方":"s-off","月營收推估":"s-est","分析師共識":"s-con","Yahoo":"s-con","手動":"s-man"};
const srcChip = src => src ? `<span class="chip ${SRC_CLS[src]||""}">${src}</span>` : "";
function quart(arr,q){ const a=[...arr].sort((x,y)=>x-y), pos=(a.length-1)*q, lo=Math.floor(pos), hi=Math.ceil(pos); return a[lo]+(a[hi]-a[lo])*(pos-lo); }
function peersOf(code){
  const t = DB.stocks[code], f = FS(code);
  if(Array.isArray(f.peers)) return f.peers.filter(c => DB.stocks[c]);
  return Object.keys(DB.stocks).filter(c => c!==code && !DB.stocks[c].hidden && DB.stocks[c].market===t.market &&
    (DB.stocks[c].groups||[]).some(g => (t.groups||[]).includes(g))).sort((a,b)=>(DB.stocks[a].order??999)-(DB.stocks[b].order??999));
}

function calc(code){
  const st = SET(), f = FS(code), basis = f.basis || "ttm", pick = f.pick || {};
  const px = priceOf(code), eps = epsOf(code, basis);
  const peers = peersOf(code).map(c => {
    const pp = priceOf(c), e = epsOf(c, basis), pe = pp && e>0 ? pp.p/e : null;
    const auto = pe!=null && pe <= st.peCap;
    return {c, name:DB.stocks[c].name, px:pp, eps:e, pe, auto, inc: pe!=null && (c in pick ? pick[c] : auto), forced: c in pick};
  });
  const pes = peers.filter(x => x.inc).map(x => x.pe);
  const stats = pes.length >= 2 ? {n:pes.length, min:Math.min(...pes), q1:quart(pes,.25), med:quart(pes,.5),
    mean:pes.reduce((a,b)=>a+b,0)/pes.length, q3:quart(pes,.75), max:Math.max(...pes)} : null;
  const manual = Array.isArray(f.manualPE) && f.manualPE.every(x => numOrNull(x)>0) ? f.manualPE.map(Number) : null;
  let base = null, src = "none";
  if(stats && !f.useManual){ base = [stats.q1, stats.med, stats.q3]; src = "peers"; }
  else if(manual){ base = manual; src = "manual"; }
  const scores = st.factors.map((_,i) => +((f.scores||[])[i] || 0));
  const wsum = st.factors.reduce((a,[n,w],i) => a + (+w)*scores[i], 0);
  const adj = 1 + wsum * st.adjPerPoint;
  const pe3 = base ? base.map(x => x*adj) : null;
  const tgt = pe3 && eps>0 ? pe3.map(x => x*eps) : null;
  const probs = (f.probs || st.probs).map(Number), psum = probs.reduce((a,b)=>a+b,0) || 1;
  const wt = tgt ? tgt.reduce((a,t,i) => a + t*probs[i], 0) / psum : null;
  return {st, f, basis, px, eps, peers, stats, manual, base, src, scores, wsum, adj, pe3, tgt, probs, psum, wt,
          curPE: px && eps>0 ? px.p/eps : null};
}

const todayISO = () => { const d = new Date(Date.now() + 8*3600e3); return d.toISOString().slice(0,10); };
const WD = "日一二三四五六";
const typeChip = t => `<span class="chip t-${t}">${t}</span>`;
const inGroup = c => { const s = DB.stocks[c]; return s && !s.hidden && (group==="ALL" || (s.groups||[]).includes(group)); };
const EVENT_TYPES = ["法說會","股東會","股利","財報","董事會","庫藏股"];
const upcoming = () => (EVENTS.events||[]).filter(e => (e.date||"") >= todayISO() &&
  (EVENT_TYPES.includes(e.type) || (e.announced && e.date > e.announced))).sort((a,b)=>a.date.localeCompare(b.date));
const ymAdd = (ym,k) => { let [y,m] = ym.split("-").map(Number); m += k; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return `${y}-${String(m).padStart(2,"0")}`; };

function revenueRows(){
  const codes = Object.keys(DB.stocks).filter(c => inGroup(c) && DB.stocks[c].market==="TW" && REV[c]);
  let last = ""; codes.forEach(c => Object.keys(REV[c]).forEach(k => { if(/^\d{4}-\d{2}$/.test(k) && k > last) last = k; }));
  if(!last) return {last:null, rows:[]};
  const rows = codes.map(c => {
    const r = REV[c], cur = r[last], prev = r[ymAdd(last,-1)], ly = r[ymAdd(last,-12)];
    const y = last.slice(0,4), mm = +last.slice(5);
    let ytd = 0, ytdL = 0, ok = true;
    for(let i=1;i<=mm;i++){ const a = r[`${y}-${String(i).padStart(2,"0")}`], b = r[`${+y-1}-${String(i).padStart(2,"0")}`]; if(a==null||b==null){ok=false;break;} ytd+=a; ytdL+=b; }
    return {c, name:DB.stocks[c].name, cur, mom: cur!=null&&prev ? cur/prev-1 : null, yoy: cur!=null&&ly ? cur/ly-1 : null, ytd: ok&&ytdL ? ytd/ytdL-1 : null};
  }).sort((a,b)=>(DB.stocks[a.c].order??999)-(DB.stocks[b.c].order??999));
  return {last, rows};
}

function evRow(e, showSoon){

/* =================== Beta =================== */
const BENCH = m => m === "US" ? "^GSPC" : "^TWII";
/* 用最近 n 個共同交易日的日報酬：beta = 共變異數(股票, 大盤) ÷ 變異數(大盤) */
function betaOf(code, n = 250){
  const s = DB.stocks[code], idx = s && DB.stocks[BENCH(s.market)];
  if(!s || !idx || s.market === "IDX") return null;
  const im = new Map(idx.history.map(b => [b.d, b.c]));
  const pts = []; let prev = null;
  for(const b of s.history){
    const ic = im.get(b.d);
    if(ic == null){ prev = null; continue; }
    if(prev) pts.push([b.c / prev.c - 1, ic / prev.ic - 1]);
    prev = {c: b.c, ic};
  }
  const r = pts.slice(-n); if(r.length < 60) return null;
  const k = r.length, ms = r.reduce((a,p)=>a+p[0],0)/k, mm = r.reduce((a,p)=>a+p[1],0)/k;
  let cov = 0, vm = 0, vs = 0;
  r.forEach(([x,y]) => { cov += (x-ms)*(y-mm); vm += (y-mm)**2; vs += (x-ms)**2; });
  cov /= (k-1); vm /= (k-1); vs /= (k-1);
  return {beta: cov/vm, cov, varM: vm, corr: cov/Math.sqrt(vm*vs), n: k, bench: idx.name || BENCH(s.market),
          from: s.history.at(-k)?.d};
}

    </div></div>
  <div class="card pad note">Beta 只衡量跟大盤連動的程度，不含個股自身消息的風險；期間或用日報酬、週報酬不同，算出的數字會不一樣。研究用途，不構成投資建議。</div>`;
  box.querySelectorAll("[data-bc]").forEach(el => el.onchange = () => { BROWS[+el.dataset.bc].code = el.value; saveBRows(); renderBeta(); });
  box.querySelectorAll("[data-bv]").forEach(el => el.onchange = () => { BROWS[+el.dataset.bv].v = Math.max(0, +el.value||0); saveBRows(); renderBeta(); });
  box.querySelectorAll("[data-bdel]").forEach(el => el.onclick = () => { BROWS.splice(+el.dataset.bdel,1); saveBRows(); renderBeta(); });
  box.querySelector("[data-badd]").onclick = () => { BROWS.push({code:"CASH", v:0}); saveBRows(); renderBeta(); };
}

/* ---------- 事件 ---------- */
$("#date").onchange = () => { render(); if(view==="model") renderModel(); };
$("#csv").onclick = downloadCSV;
$("#copy").onclick = copyPrices;
document.querySelectorAll("#range button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#range button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
  range = +b.dataset.r; renderDetail();
});
document.querySelectorAll("thead th[data-k]").forEach(th => th.onclick = () => {
  const k = th.dataset.k; sortDir = sortKey===k ? -sortDir : (k==="name"?1:-1); sortKey = k; render();
});
addEventListener("resize", () => selected && renderDetail());
load();
</script>
</body>
